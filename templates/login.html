{% extends "base.html" %}
{% block title %}Login · File Security Manager{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8">
  <h2 class="text-xl font-medium mb-1">Login</h2>
  <p class="text-slate-400 text-sm mb-6">Access encrypt, decrypt, and hash tools.</p>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Username</label>
      <input name="username" required class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 outline-none focus:border-cyan-500" />
    </div>
    <div>
      <label class="block text-sm mb-1">Password</label>
      <input name="password" type="password" required class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 outline-none focus:border-cyan-500" />
    </div>
    <button class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-medium rounded-lg py-2">Login</button>
  </form>
  <p class="text-sm text-slate-400 mt-4">No account?
    <a href="{{ url_for('register') }}" class="text-cyan-400 hover:underline">Register</a>
  </p>
</div>
{% endblock %}
